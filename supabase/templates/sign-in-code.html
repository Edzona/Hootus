<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="font-family:Arial,sans-serif;color:#17281e;background:#faf8f0;padding:32px">
    <main style="max-width:480px;margin:auto">
      <h1>Your Hootus sign-in code</h1>
      <p>Enter this code in the Hootus tab where you requested it:</p>
      <p style="font-family:monospace;font-size:36px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
      <p>This code expires in 10 minutes and can only be used once. Keep it private.</p>
      <p>If you didn’t request this code, you can ignore this email.</p>
    </main>
  </body>
</html>
