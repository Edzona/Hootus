name: Backend SQL and types
on:
  pull_request:
    paths: ['backend/**', 'supabase/**', 'package.json', 'package-lock.json', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'supabase/**', 'package.json', 'package-lock.json', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQL_GENERATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      # The Supabase CLI is a pinned devDependency of the repository root.
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npx supabase start
      - run: npm run check
        working-directory: backend
      - if: always()
        run: supabase stop --no-backup
